<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | NTVC</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <!-- navigation section -->
      <nav>
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="courses.html">Courses</a>
        <a href="contact.html">Contact</a>
       
    </nav>
    <!-- herosection -->
    <section class="hero-contact">
        <h1>Contact Us</h1>
        <p>Get in touch with us!</p>
    </section>
    <section class="main-section">
        <div class="info">
           <img src="https://images.unsplash.com/photo-1606761568499-6d2451b23c66?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="school">
           <h2>Get in Touch</h2>
           <p>Email: info@ntvc.com</p>
           <p>Phone: +1 (123) 456-7890</p>
           <p>Location: 123 Main Street, City, Country</p>
        </div>
        <div class="form">
            <h2>Contact Form</h2>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>

        </div>

    </section>

</body>
</html>
